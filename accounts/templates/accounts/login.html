{% load static %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | منصة تشخيص مهارات نافس</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Arabic Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --background: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(37, 99, 235, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(37, 99, 235, 0.10),
                    transparent 30%
                ),
                var(--background);

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;
            padding: 42px 40px 35px;
            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.10),
                0 5px 15px rgba(15, 23, 42, 0.04);
        }

        /* =========================
           LOGO
        ========================= */



        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-wrapper {
            width: 190px;
            height: 130px;
            margin: 0 auto 18px;

            border-radius: 22px;
            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(15, 23, 42, 0.15);

            background: #2100b8;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-title {
            margin: 0;
            color: var(--dark);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.6;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* =========================
           LOGIN TITLE
        ========================= */

        .login-heading {
            text-align: center;
            margin: 25px 0 25px;
        }

        .login-heading h2 {
            margin: 0;
            color: var(--dark);
            font-size: 21px;
            font-weight: 700;
        }

        .login-heading p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
        }

        .form-control-custom {
            width: 100%;
            height: 52px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: #f8fafc;

            padding: 0 45px 0 15px;

            color: var(--dark);
            font-family: "Cairo", sans-serif;
            font-size: 14px;

            outline: none;

            transition: all 0.2s ease;
        }

        .form-control-custom::placeholder {
            color: #94a3b8;
        }

        .form-control-custom:focus {
            background: #ffffff;
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #94a3b8;

            cursor: pointer;
            padding: 4px;

            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        /* =========================
           ERROR
        ========================= */

        .login-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;

            border-radius: 12px;

            padding: 12px 14px;
            margin-bottom: 20px;

            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        /* =========================
           BUTTON
        ========================= */

        .login-button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 12px;

            background: var(--primary);
            color: #ffffff;

            font-family: "Cairo", sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            background: var(--primary-dark);

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* =========================
           FOOTER
        ========================= */

        .login-footer {
            text-align: center;
            margin-top: 28px;

            color: #94a3b8;
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 20px 12px;
            }

            .login-card {
                padding: 32px 22px 28px;
                border-radius: 20px;
            }

            .logo-wrapper {
                width: 105px;
                height: 105px;
                border-radius: 18px;
            }

            .brand-title {
                font-size: 21px;
            }

            .login-heading h2 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- BRAND -->
        <div class="brand">

            <div class="logo-wrapper">
                <img
                    src="{% static 'images/logo.png' %}"
                    alt="منصة تشخيص مهارات نافس"
                >
            </div>

            <h1 class="brand-title">
                
            </h1>

            <div class="brand-subtitle">
                نظام إدارة مدرسة
            </div>

        </div>


        <!-- LOGIN HEADING -->
        <div class="login-heading">

            <h2>
                تسجيل الدخول
            </h2>

            <p>
                
            </p>

        </div>


        <!-- ERRORS -->
        {% if form.errors %}
            <div class="login-error">
                <i class="fa-solid fa-circle-exclamation"></i>

                <span>
                    اسم المستخدم أو كلمة المرور غير صحيحة.
                </span>
            </div>
        {% endif %}


        <!-- FORM -->
        <form method="post">

            {% csrf_token %}

            <!-- USERNAME -->
            <div class="form-group">

                <label
                    for="id_username"
                    class="form-label"
                >
                    اسم المستخدم
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-user input-icon"></i>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control-custom"
                        placeholder="أدخل اسم المستخدم"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label
                    for="id_password"
                    class="form-label"
                >
                    كلمة المرور
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock input-icon"></i>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control-custom"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="إظهار كلمة المرور"
                    >
                        <i
                            id="passwordIcon"
                            class="fa-solid fa-eye"
                        ></i>
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-button"
            >
                <i class="fa-solid fa-right-to-bracket"></i>

                <span>
                    تسجيل الدخول
                </span>
            </button>

        </form>


        <!-- FOOTER -->
        <div class="login-footer">
            © 2026 منصة مـدرستي
        </div>

    </div>

</div>


<script>
    function togglePassword() {

        const passwordInput =
            document.getElementById("id_password");

        const passwordIcon =
            document.getElementById("passwordIcon");

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            passwordIcon.classList.remove("fa-eye");
            passwordIcon.classList.add("fa-eye-slash");

        } else {

            passwordInput.type = "password";

            passwordIcon.classList.remove("fa-eye-slash");
            passwordIcon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
