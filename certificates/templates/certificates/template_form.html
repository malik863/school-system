
{% extends "schools/base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card">

        <div class="card-body">

            <h2 class="mb-4">
                {{ title }}
            </h2>

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                {% for field in form %}

                    <div class="mb-3">

                        <label class="form-label">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.help_text %}
                            <div class="form-text">
                                {{ field.help_text }}
                            </div>
                        {% endif %}

                        {% for error in field.errors %}
                            <div class="text-danger">
                                {{ error }}
                            </div>
                        {% endfor %}

                    </div>

                {% endfor %}

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        حفظ القالب
                    </button>

                    <a
                        href="{% url 'certificates:template_list' %}"
                        class="btn btn-secondary"
                    >
                        إلغاء
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
