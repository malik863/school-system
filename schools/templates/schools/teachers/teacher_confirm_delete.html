{% extends "schools/base.html" %}
{% block title %}حذف المعلم{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body"><h4>تأكيد حذف المعلم</h4><p>هل أنت متأكد من حذف <strong>{{ teacher.get_full_name|default:teacher.username }}</strong>؟</p><p class="text-danger">سيتم حذف حساب المعلم أيضاً.</p><form method="post">{% csrf_token %}<button class="btn btn-danger">نعم، حذف</button> <a href="{% url 'manager:teacher_list' %}" class="btn btn-secondary">إلغاء</a></form></div></div></div></div>{% endblock %}
