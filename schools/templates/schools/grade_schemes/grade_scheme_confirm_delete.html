{% extends "schools/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>حذف نظام الدرجات</h2>

    <p>
        هل أنت متأكد من حذف نظام الدرجات الخاص بمادة
        <strong>{{ scheme.subject.name }}</strong>؟
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit"
                class="btn btn-danger">
            نعم، حذف
        </button>

        <a href="{% url 'manager:grade_scheme_list' %}"
           class="btn btn-secondary">
            إلغاء
        </a>

    </form>

</div>

{% endblock %}
