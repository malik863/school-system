
{% extends "schools/teacher/base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card">

        <div class="card-body text-center py-5">

            <h3>
                حذف التقييم
            </h3>

            <p class="mt-3">
                هل أنت متأكد من حذف التقييم
                <strong>{{ assessment.title }}</strong>؟
            </p>

            <p class="text-danger">
                سيتم حذف جميع الدرجات المرتبطة بهذا التقييم.
            </p>


            <form method="post" class="mt-4">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    نعم، حذف
                </button>

                <a href="{% url 'teacher:assessment_detail' assessment.pk %}"
                   class="btn btn-secondary">
                    إلغاء
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
